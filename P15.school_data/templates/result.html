<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Menu</title>
    <link rel="stylesheet" href=" {{ url_for('static', filename='styles.css')}} ">
</head>
<body>
    <div class="header">
        <h1>School</h1>
    </div>
    <div class="st-menu-head">
        <h2>Student Menu</h2>
    </div>

    <div class="st-info">

        <h3 class="st-info-head">Student Information</h3>
        <table class="student-table">
            <tbody>
                <tr>
                    <td>Name</td>
                    <td>{{ name }}</td>
                </tr>
                <tr>
                    <td>Age</td>
                    <td>{{ age }}</td>
                </tr>
                <tr>
                    <td>Student ID</td>
                    <td>{{ id }}</td>
                </tr>
            </tbody>
        </table>
        <div class="course-table">

            <div>
                <h3 class="st-info-head">Grades</h3>
                <table class="student-table">
                    <thead>
                        <tr>
                            <td>Course</td>
                            <td>Credits</td>
                            <td>Grade</td>
                        </tr>
                    </thead>
                    <tbody>
                        {% for code, grade in grades.items() %}
                        <tr>
                            <td>{{ code }}</td>
                            <td>{{ grade[1] }}</td>
                            <td>{{ grade[0] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div>
                <h3 class="st-info-head">Add / Drop Course</h3>
                <button class="ad-button add-selected js-add-button selected-button">Add</button>
                <button class="ad-button js-drop-button">Drop</button>
                <form action="/course" method="POST">
                    <input class="input-box js-course-input" type="text" placeholder="Course Code" name="course-code">
                    <button class="submit-button js-course-submit add-selected" type="submit" value="add" name="sub-button">Add</button>
                    <p class="not-found-info"></p>
                </form>
            </div>
        </div>
        
        <button class="back-button" onclick="window.location.href='/'">Go Back</button>

        <!--
        <h3 class="st-info-head">Student Information</h3>
        <pre>NAME:  {{ name }}</pre>
        <pre>ID:  {{ id }}</pre>
        <pre>AGE:  {{ age }}</pre>

        -->

    </div>

    <script src="{{ url_for('static', filename='student.js')}}"></script>
</body>
</html>
